AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: UCP Merchant Server - Serverless FastAPI Application

Parameters:
  Auth0Domain:
    Type: String
    Default: auth0connectedapps.demo-connect.us
    Description: Auth0 custom domain that issues access tokens (the iss claim)
  AuthAudience:
    Type: String
    Default: api://ucp.session.service
    Description: Resource server identifier expected in the token aud claim
  AuthMode:
    Type: String
    Default: enforce
    AllowedValues: [off, optional, enforce]
  AllowedClientIds:
    Type: CommaDelimitedList
    Default: "PX3u5zLgnC39WzYFnGU6Aval5V9xabGd"
    Description: Auth0 client ids (azp) permitted to call this merchant
  LoyaltyClaim:
    Type: String
    Default: https://demo.okta.com/loyaltyId
    Description: Access-token claim that carries the buyer's loyaltyId

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable
        TRANSACTIONS_TABLE: !Ref TransactionsTable
        INVENTORY_TABLE: !Ref InventoryTable
        CHECKOUTS_TABLE: !Ref CheckoutsTable
        ORDERS_TABLE: !Ref OrdersTable
        CUSTOMERS_TABLE: !Ref CustomersTable
        CUSTOMER_ADDRESSES_TABLE: !Ref CustomerAddressesTable
        DISCOUNTS_TABLE: !Ref DiscountsTable
        SHIPPING_RATES_TABLE: !Ref ShippingRatesTable
        PROMOTIONS_TABLE: !Ref PromotionsTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        REQUEST_LOGS_TABLE: !Ref RequestLogsTable
        PAYMENT_INSTRUMENTS_TABLE: !Ref PaymentInstrumentsTable
        CARTS_TABLE: !Ref CartsTable
        LOYALTY_LEDGER_TABLE: !Ref LoyaltyLedgerTable
        LOYALTY_POINTS_TABLE: RetailLoyaltyPointsTracker
        AUTH0_DOMAIN: !Ref Auth0Domain
        AUTH_AUDIENCE: !Ref AuthAudience
        AUTH_MODE: !Ref AuthMode
        AUTH_ALLOWED_CLIENT_IDS: !Join [',', !Ref AllowedClientIds]
        LOYALTY_CLAIM: !Ref LoyaltyClaim

Resources:
  # DynamoDB Tables
  LoyaltyLedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-loyalty-ledger'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: entry_id
          AttributeType: S
      KeySchema:
        - AttributeName: entry_id
          KeyType: HASH

  CartsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-carts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-products'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-inventory'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH

  CheckoutsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-checkouts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: buyer_sub
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: buyer-sub-index
          KeySchema:
            - AttributeName: buyer_sub
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-customers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  CustomerAddressesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-customer-addresses'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: customer-id-index
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DiscountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-discounts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH

  ShippingRatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-shipping-rates'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: country_code
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: country-code-index
          KeySchema:
            - AttributeName: country_code
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PromotionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-promotions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-idempotency'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: key
          AttributeType: S
      KeySchema:
        - AttributeName: key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RequestLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-request-logs'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: timestamp-index
          KeySchema:
            - AttributeName: timestamp
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PaymentInstrumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-payment-instruments'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-transactions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # Lambda Function
  UcpServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ucp-server'
      CodeUri: .
      Handler: lambda_handler.handler
      Description: UCP Merchant Server FastAPI Application
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CheckoutsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomerAddressesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DiscountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ShippingRatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PromotionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequestLogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentInstrumentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LoyaltyLedgerTable
        # Existing balance table owned outside this stack. Our writes are
        # conditional (see db_dynamodb.reserve_loyalty_points).
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RetailLoyaltyPointsTracker'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowHeaders:
            - "*"
          AllowMethods:
            - "*"
          MaxAge: 86400

  # Data Initialization Function
  DataInitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-data-init'
      CodeUri: .
      Handler: lambda_data_init.handler
      Description: Initialize DynamoDB tables with sample data
      Timeout: 300
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DiscountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ShippingRatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PromotionsTable

Outputs:
  UcpServerFunctionUrl:
    Description: "Function URL for UCP Server"
    Value: !GetAtt UcpServerFunctionUrl.FunctionUrl

  UcpDiscoveryUrl:
    Description: "UCP Discovery Endpoint"
    Value: !Sub '${UcpServerFunctionUrl.FunctionUrl}.well-known/ucp'

  DataInitFunctionArn:
    Description: "Data Initialization Function ARN (invoke manually to load sample data)"
    Value: !GetAtt DataInitFunction.Arn
